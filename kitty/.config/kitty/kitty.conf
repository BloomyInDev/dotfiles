#include ./theme.conf

# Fonts 
font_family      family="Fira Code"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 12.0

# Cursor
cursor #ffffff
cursor_shape block

# Global style
# foreground #ffffff
background #27292c
background_opacity 0.8

# Other
disable_ligatures never
detect_urls yes
enable_audio_bell no
