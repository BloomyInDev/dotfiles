# Wallpapers are not shipped with this repo: source your own, drop them
# somewhere readable (/usr/share/backgrounds/ or ~/Pictures/wallpapers/) and
# point the paths below at them. The default below is not provided by any
# package, so it has to be put there by hand.
#
# Reload after changing a wallpaper with SUPER + SHIFT + W.

wallpaper {
  monitor = eDP-1
  path = /usr/share/backgrounds/Northern Forest.png
  fit_mode = cover
}

wallpaper {
  monitor = 
  path = /usr/share/backgrounds/Northern Forest.png
  fit_mode = cover
}

splash = false
